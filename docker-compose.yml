name: ${COMPOSE_PROJECT_NAME:-checkout-surge-gpt-55}

# Supported local contract: one api (the sole maintenance authority), one worker runtime,
# one Next.js web process, and one load-orchestrator process with one journal.
# dashboard-proxy is the single ingress path, not another application authority.

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  API_BASE_URL: http://api:4000
  MOCK_ERP_BASE_URL: http://mock-erp:4100
  LOAD_ORCHESTRATOR_BASE_URL: http://load-orchestrator:4200
  WEB_BASE_URL: http://localhost:8080
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}

x-database-env: &database-env
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/checkout_surge

x-data-env: &data-env
  <<: *database-env
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: checkout_surge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - checkout-surge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d checkout_surge"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - checkout-surge-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.node-service
      target: runtime
      args:
        SERVICE_NAME: api
    restart: on-failure
    environment:
      <<: [*app-env, *data-env]
      CONTROL_SERVICE_TOKEN: ${CONTROL_SERVICE_TOKEN}
      PUBLIC_CLIENT_COOKIE_SECRET: ${PUBLIC_CLIENT_COOKIE_SECRET}
      PORT: 4000
      HOST: 0.0.0.0
      API_LISTEN_BACKLOG: ${API_LISTEN_BACKLOG:-8192}
      API_POSTGRES_POOL_MAX: ${API_POSTGRES_POOL_MAX:-10}
      API_READINESS_TIMEOUT_MS: ${API_READINESS_TIMEOUT_MS:-2000}
      API_TRUSTED_PROXY_CIDRS: "${API_TRUSTED_PROXY_CIDRS:-127.0.0.0/8,::1/128,172.30.0.2/32}"
      DASHBOARD_MAX_SSE_CLIENTS: ${DASHBOARD_MAX_SSE_CLIENTS:-80}
      DASHBOARD_MAX_SSE_CLIENTS_PER_SOURCE: ${DASHBOARD_MAX_SSE_CLIENTS_PER_SOURCE:-6}
      DASHBOARD_SSE_MAX_BUFFERED_FRAMES: ${DASHBOARD_SSE_MAX_BUFFERED_FRAMES:-32}
      DASHBOARD_SSE_MAX_BUFFERED_BYTES: ${DASHBOARD_SSE_MAX_BUFFERED_BYTES:-262144}
      DASHBOARD_SSE_RETRY_AFTER_SECONDS: ${DASHBOARD_SSE_RETRY_AFTER_SECONDS:-10}
      DASHBOARD_RECOVERY_MAX_CONCURRENT: ${DASHBOARD_RECOVERY_MAX_CONCURRENT:-3}
      DASHBOARD_RECOVERY_GLOBAL_MAX_REQUESTS: ${DASHBOARD_RECOVERY_GLOBAL_MAX_REQUESTS:-60}
      DASHBOARD_RECOVERY_PER_SOURCE_MAX_REQUESTS: ${DASHBOARD_RECOVERY_PER_SOURCE_MAX_REQUESTS:-12}
      DASHBOARD_RECOVERY_WINDOW_SECONDS: ${DASHBOARD_RECOVERY_WINDOW_SECONDS:-60}
      DASHBOARD_RECOVERY_RETRY_AFTER_SECONDS: ${DASHBOARD_RECOVERY_RETRY_AFTER_SECONDS:-10}
      DASHBOARD_RECOVERY_TIMEOUT_MS: ${DASHBOARD_RECOVERY_TIMEOUT_MS:-5000}
      RESERVATION_HOLD_MINUTES: ${RESERVATION_HOLD_MINUTES:-15}
      IDEMPOTENCY_TTL_SECONDS: ${IDEMPOTENCY_TTL_SECONDS:-1800}
      PENDING_PERSISTENCE_RETRY_AFTER_SECONDS: ${PENDING_PERSISTENCE_RETRY_AFTER_SECONDS:-30}
      PENDING_PERSISTENCE_RECOVERY_WINDOW_SECONDS: ${PENDING_PERSISTENCE_RECOVERY_WINDOW_SECONDS:-300}
      PENDING_PERSISTENCE_RECOVERY_MAX_ATTEMPTS: ${PENDING_PERSISTENCE_RECOVERY_MAX_ATTEMPTS:-6}
      PENDING_PERSISTENCE_RECOVERY_INITIAL_BACKOFF_MS: ${PENDING_PERSISTENCE_RECOVERY_INITIAL_BACKOFF_MS:-1000}
      PENDING_PERSISTENCE_RECOVERY_MAX_BACKOFF_MS: ${PENDING_PERSISTENCE_RECOVERY_MAX_BACKOFF_MS:-30000}
      PENDING_PERSISTENCE_RECOVERY_POLL_INTERVAL_MS: ${PENDING_PERSISTENCE_RECOVERY_POLL_INTERVAL_MS:-1000}
      PENDING_PERSISTENCE_RECOVERY_DISCOVERY_TIMEOUT_MS: ${PENDING_PERSISTENCE_RECOVERY_DISCOVERY_TIMEOUT_MS:-2000}
      PENDING_PERSISTENCE_RECOVERY_MAX_CONCURRENT_DIRECT_ATTEMPTS: ${PENDING_PERSISTENCE_RECOVERY_MAX_CONCURRENT_DIRECT_ATTEMPTS:-3}
      DEMO_MAX_BUYERS: ${DEMO_MAX_BUYERS:-100000}
      DEMO_MAX_TOTAL_REQUESTS: ${DEMO_MAX_TOTAL_REQUESTS:-100000}
      DEMO_MAX_REQUESTS_PER_SECOND: ${DEMO_MAX_REQUESTS_PER_SECOND:-10000}
      DEMO_MAX_TRAFFIC_DURATION_SECONDS: ${DEMO_MAX_TRAFFIC_DURATION_SECONDS:-300}
      DEMO_MAX_TRAFFIC_START_DELAY_SECONDS: ${DEMO_MAX_TRAFFIC_START_DELAY_SECONDS:-30}
      DEMO_MAX_PRE_ALLOCATED_VUS: ${DEMO_MAX_PRE_ALLOCATED_VUS:-10000}
      DEMO_MAX_VUS: ${DEMO_MAX_VUS:-10000}
      DEMO_MAX_ESTIMATED_OCCUPANCY_SECONDS: ${DEMO_MAX_ESTIMATED_OCCUPANCY_SECONDS:-600}
      ESTIMATOR_JOB_OVERHEAD_MS: ${ESTIMATOR_JOB_OVERHEAD_MS:-130}
      ESTIMATOR_SETTLEMENT_OVERHEAD_SECONDS: ${ESTIMATOR_SETTLEMENT_OVERHEAD_SECONDS:-15}
      ESTIMATOR_TRANSIENT_ERROR_DEMAND_MARGIN: ${ESTIMATOR_TRANSIENT_ERROR_DEMAND_MARGIN:-1.25}
      ESTIMATOR_EXCESS_ATTEMPT_PAUSE_SECONDS: ${ESTIMATOR_EXCESS_ATTEMPT_PAUSE_SECONDS:-1}
      DEMO_RUN_FINALIZATION_POLL_INTERVAL_SECONDS: ${DEMO_RUN_FINALIZATION_POLL_INTERVAL_SECONDS:-5}
    sysctls:
      net.core.somaxconn: "${API_LISTEN_BACKLOG:-8192}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      default:
      dashboard-edge:
        aliases:
          - api-dashboard-edge

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.node-service
      target: runtime
      args:
        SERVICE_NAME: worker
    environment:
      <<: [*app-env, *data-env]
      HEALTH_PORT: 4300
      HEALTH_HOST: 0.0.0.0
      WORKER_POSTGRES_POOL_MAX: ${WORKER_POSTGRES_POOL_MAX:-10}
      # Aggregate BullMQ scanning ceiling; must cover the shared accepted-run cap (10).
      ORDER_PROCESS_CONCURRENCY: ${ORDER_PROCESS_CONCURRENCY:-10}
      NOTIFICATION_RECORD_CONCURRENCY: ${NOTIFICATION_RECORD_CONCURRENCY:-5}
      ORDER_DISPATCH_SCAN_INTERVAL_MS: ${ORDER_DISPATCH_SCAN_INTERVAL_MS:-1000}
      ORDER_DISPATCH_BATCH_SIZE: ${ORDER_DISPATCH_BATCH_SIZE:-100}
      ORDER_DISPATCH_MINIMUM_QUEUED_AGE_MS: ${ORDER_DISPATCH_MINIMUM_QUEUED_AGE_MS:-1000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-erp:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4300/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  mock-erp:
    build:
      context: .
      dockerfile: docker/Dockerfile.node-service
      target: runtime
      args:
        SERVICE_NAME: mock-erp
    environment:
      <<: [*app-env, *data-env]
      PORT: 4100
      HOST: 0.0.0.0
      MOCK_ERP_POSTGRES_POOL_MAX: ${MOCK_ERP_POSTGRES_POOL_MAX:-5}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4100/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  load-orchestrator:
    build:
      context: .
      dockerfile: apps/load-orchestrator/Dockerfile
      target: runtime
    environment:
      <<: *app-env
      CONTROL_SERVICE_TOKEN: ${CONTROL_SERVICE_TOKEN}
      PORT: 4200
      HOST: 0.0.0.0
      K6_BINARY: /usr/local/bin/k6
      K6_CANCELLATION_TIMEOUT_MS: ${K6_CANCELLATION_TIMEOUT_MS:-10000}
      COMPLETION_DELIVERY_RETRY_INTERVAL_MS: ${COMPLETION_DELIVERY_RETRY_INTERVAL_MS:-5000}
      LOAD_ORCHESTRATOR_STATE_DIR: /var/lib/checkout-surge/load-orchestrator
    sysctls:
      net.ipv4.tcp_tw_reuse: "${LOAD_ORCHESTRATOR_TCP_TW_REUSE:-1}"
      net.ipv4.ip_local_port_range: "${LOAD_ORCHESTRATOR_PORT_RANGE:-10240 65535}"
    volumes:
      - checkout-surge-load-orchestrator-data:/var/lib/checkout-surge/load-orchestrator
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4200/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
    environment:
      <<: *app-env
      CONTROL_SERVICE_TOKEN: ${CONTROL_SERVICE_TOKEN}
      PORT: 3000
      ADMIN_DASHBOARD_PASSPHRASE: ${ADMIN_DASHBOARD_PASSPHRASE}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      ADMIN_SESSION_MAX_AGE_SECONDS: ${ADMIN_SESSION_MAX_AGE_SECONDS:-28800}
      ADMIN_LOGIN_CLIENT_ATTEMPTS: ${ADMIN_LOGIN_CLIENT_ATTEMPTS:-5}
      ADMIN_LOGIN_GLOBAL_ATTEMPTS: ${ADMIN_LOGIN_GLOBAL_ATTEMPTS:-20}
      ADMIN_LOGIN_WINDOW_SECONDS: ${ADMIN_LOGIN_WINDOW_SECONDS:-60}
      PUBLIC_CLIENT_COOKIE_SECRET: ${PUBLIC_CLIENT_COOKIE_SECRET}
    depends_on:
      api:
        condition: service_healthy
      mock-erp:
        condition: service_healthy
      load-orchestrator:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  dashboard-proxy:
    image: caddy:2-alpine
    environment:
      CODESPACES: ${CODESPACES:-false}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
    ports:
      - "${DASHBOARD_PROXY_HOST_PORT:-8080}:8080"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      default:
      dashboard-edge:
        ipv4_address: 172.30.0.2
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  runtime-setup:
    profiles: ["setup"]
    build:
      context: .
      dockerfile: packages/db/Dockerfile
      target: runtime
    environment:
      <<: [*app-env, *database-env]
      PUBLIC_RUN_BUDGET_WINDOW_SECONDS: ${PUBLIC_RUN_BUDGET_WINDOW_SECONDS:-300}
      PUBLIC_RUN_BUDGET_PER_VISITOR_MAX_STARTS: ${PUBLIC_RUN_BUDGET_PER_VISITOR_MAX_STARTS:-2}
      PUBLIC_RUN_BUDGET_GLOBAL_MAX_STARTS: ${PUBLIC_RUN_BUDGET_GLOBAL_MAX_STARTS:-6}
      PUBLIC_CUSTOM_MAX_TOTAL_REQUESTS: ${PUBLIC_CUSTOM_MAX_TOTAL_REQUESTS:-10000}
      PUBLIC_CUSTOM_MAX_BUYERS: ${PUBLIC_CUSTOM_MAX_BUYERS:-10000}
      PUBLIC_CUSTOM_MAX_REQUESTS_PER_SECOND: ${PUBLIC_CUSTOM_MAX_REQUESTS_PER_SECOND:-1000}
      PUBLIC_CUSTOM_MAX_TRAFFIC_DURATION_SECONDS: ${PUBLIC_CUSTOM_MAX_TRAFFIC_DURATION_SECONDS:-120}
      PUBLIC_CUSTOM_MAX_TRAFFIC_START_DELAY_SECONDS: ${PUBLIC_CUSTOM_MAX_TRAFFIC_START_DELAY_SECONDS:-10}
      PUBLIC_CUSTOM_MAX_PRE_ALLOCATED_VUS: ${PUBLIC_CUSTOM_MAX_PRE_ALLOCATED_VUS:-1000}
      PUBLIC_CUSTOM_MAX_VUS: ${PUBLIC_CUSTOM_MAX_VUS:-1000}
      PUBLIC_CUSTOM_MAX_STARTING_STOCK: ${PUBLIC_CUSTOM_MAX_STARTING_STOCK:-1000}
      PUBLIC_CUSTOM_MAX_ERP_LATENCY_MS: ${PUBLIC_CUSTOM_MAX_ERP_LATENCY_MS:-2000}
      PUBLIC_CUSTOM_MIN_ERP_MAX_TPS: ${PUBLIC_CUSTOM_MIN_ERP_MAX_TPS:-1}
      PUBLIC_CUSTOM_MAX_ERP_MAX_TPS: ${PUBLIC_CUSTOM_MAX_ERP_MAX_TPS:-50}
      PUBLIC_CUSTOM_MAX_ERP_ERROR_RATE: ${PUBLIC_CUSTOM_MAX_ERP_ERROR_RATE:-0.25}
    depends_on:
      postgres:
        condition: service_healthy

  runtime-tools:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-tools
    working_dir: /workspace
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:4000
      DIRECT_WEB_BASE_URL: http://web:3000
      WORKER_HEALTH_BASE_URL: http://worker:4300
      MOCK_ERP_BASE_URL: http://mock-erp:4100
      LOAD_ORCHESTRATOR_BASE_URL: http://load-orchestrator:4200
      WEB_BASE_URL: http://dashboard-proxy:8080
      REDIS_URL: redis://redis:6379
      CONTROL_SERVICE_TOKEN: ${CONTROL_SERVICE_TOKEN}
      DASHBOARD_RECOVERY_WINDOW_SECONDS: ${DASHBOARD_RECOVERY_WINDOW_SECONDS:-}
      RUNTIME_RECOVERY_SOAK_SECONDS: ${RUNTIME_RECOVERY_SOAK_SECONDS:-}
      RUNTIME_RECOVERY_SOAK_PROBE_INTERVAL_MS: ${RUNTIME_RECOVERY_SOAK_PROBE_INTERVAL_MS:-}
      DEMO_RUN_FINALIZATION_POLL_INTERVAL_SECONDS: ${DEMO_RUN_FINALIZATION_POLL_INTERVAL_SECONDS:-5}
      RUNTIME_SMOKE_RUN_TIMEOUT_MS: ${RUNTIME_SMOKE_RUN_TIMEOUT_MS:-}

volumes:
  checkout-surge-postgres-data:
  checkout-surge-redis-data:
  checkout-surge-load-orchestrator-data:

networks:
  dashboard-edge:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25
