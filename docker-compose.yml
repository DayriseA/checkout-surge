name: checkout-surge

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: checkout_surge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - checkout-surge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d checkout_surge"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - checkout-surge-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  checkout-surge-postgres-data:
    name: checkout-surge-postgres-data
  checkout-surge-redis-data:
    name: checkout-surge-redis-data
