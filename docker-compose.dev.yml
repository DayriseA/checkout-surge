name: ${COMPOSE_PROJECT_NAME:-checkout-surge-gpt-55}

# Host-native/debug bindings are deliberately opt-in and loopback-only.
# Use with: docker compose -f docker-compose.yml -f docker-compose.dev.yml ...
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"

  api:
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4000}:4000"

  worker:
    ports:
      - "127.0.0.1:${WORKER_HEALTH_HOST_PORT:-4300}:4300"

  mock-erp:
    ports:
      - "127.0.0.1:${MOCK_ERP_HOST_PORT:-4100}:4100"

  load-orchestrator:
    ports:
      - "127.0.0.1:${LOAD_ORCHESTRATOR_HOST_PORT:-4200}:4200"

  web:
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
