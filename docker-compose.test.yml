name: ${TEST_COMPOSE_PROJECT_NAME:-checkout-surge-gpt-55-test}

services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: checkout_surge_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${TEST_POSTGRES_HOST_PORT:-56432}:5432"
    volumes:
      - checkout-surge-test-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d checkout_surge_test"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-test:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--databases", "16"]
    ports:
      - "6380:6379"
    volumes:
      - checkout-surge-test-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  checkout-surge-test-postgres-data:
  checkout-surge-test-redis-data:
