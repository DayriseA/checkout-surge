name: checkout-surge-devcontainer

services:
  workspace:
    image: mcr.microsoft.com/devcontainers/universal:linux
    command: sleep infinity
    init: true
    privileged: true
    volumes:
      - ..:/workspaces/checkout-surge:cached
      - checkout-surge-codex-config:/mnt/codex-config
      - checkout-surge-claude-config:/mnt/claude-config
      - checkout-surge-pnpm-store:/pnpm-store
      - checkout-surge-root-node-modules:/workspaces/checkout-surge/node_modules
      - checkout-surge-web-node-modules:/workspaces/checkout-surge/apps/web/node_modules
      - checkout-surge-api-node-modules:/workspaces/checkout-surge/apps/api/node_modules
      - checkout-surge-worker-node-modules:/workspaces/checkout-surge/apps/worker/node_modules
      - checkout-surge-mock-erp-node-modules:/workspaces/checkout-surge/apps/mock-erp/node_modules
      - checkout-surge-load-orchestrator-node-modules:/workspaces/checkout-surge/apps/load-orchestrator/node_modules
      - checkout-surge-contracts-node-modules:/workspaces/checkout-surge/packages/contracts/node_modules
      - checkout-surge-logger-node-modules:/workspaces/checkout-surge/packages/logger/node_modules
      - checkout-surge-db-node-modules:/workspaces/checkout-surge/packages/db/node_modules

volumes:
  checkout-surge-codex-config:
    name: checkout-surge-codex-config
  checkout-surge-claude-config:
    name: checkout-surge-claude-config
  checkout-surge-pnpm-store:
    name: checkout-surge-pnpm-store
  checkout-surge-root-node-modules:
    name: checkout-surge-root-node-modules
  checkout-surge-web-node-modules:
    name: checkout-surge-web-node-modules
  checkout-surge-api-node-modules:
    name: checkout-surge-api-node-modules
  checkout-surge-worker-node-modules:
    name: checkout-surge-worker-node-modules
  checkout-surge-mock-erp-node-modules:
    name: checkout-surge-mock-erp-node-modules
  checkout-surge-load-orchestrator-node-modules:
    name: checkout-surge-load-orchestrator-node-modules
  checkout-surge-contracts-node-modules:
    name: checkout-surge-contracts-node-modules
  checkout-surge-logger-node-modules:
    name: checkout-surge-logger-node-modules
  checkout-surge-db-node-modules:
    name: checkout-surge-db-node-modules
